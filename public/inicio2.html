<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SafeWalk - Iniciar Sesión</title>

    <link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Montserrat:ital,wght@0,100..900;1,100..900&family=Roboto:ital,wght@0,100..900;1,100..900&display=swap" rel="stylesheet">

   <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.7/dist/css/bootstrap.min.css" rel="stylesheet">


    <link rel="stylesheet" href="css/inicio de sesion.css">
</head>
<body>

<div class="logo-section text-center">
    <div class="mb-3">
        <img src="img/logo__1_-removebg-preview.png" alt="SafeWalk Logo" class="logo-img">
    </div>

    <p class="slogan">
        Camina seguro. Llega seguro
    </p>
</div>
<div class="card login-card shadow-lg">

    <h2 class="text-center mb-4">Iniciar Sesión</h2>

    <form action="inicio.html" method="POST">

        <div class="mb-3">
            <label class="form-label">Correo Electrónico</label>
            <input
                type="email"
                class="form-control"
                placeholder="correo@ejemplo.com"
                required>
        </div>

        <div class="mb-3">
            <label class="form-label">Contraseña</label>

            <div class="input-group">
                <input
                    type="password"
                    class="form-control"
                    id="password"
                    placeholder="********"
                    required>
            </div>
        </div>

        <div class="text-end mb-3">
            <a href="recuperar_contraseña.html" class="forgot-password-link">
                ¿Olvidaste tu contraseña?
            </a>
        </div>

        <button
            type="submit"
            class="btn btn-primary w-100 login-btn" onclick="window.location.href='mp.html'">
            Iniciar Sesión
        </button>

    </form>

    <div class="text-center mt-4">
        <span>No tienes cuenta? </span>
        <a href="registrarse.html" class="register-link">
            Regístrate
        </a>
    </div>
</div>
</body>
</html>
