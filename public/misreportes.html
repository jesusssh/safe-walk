<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Mis Reportes - SafeWalk</title>
<script src="https://cdn.tailwindcss.com"></script>
<style>
       .bg-custom-dark { background-color: #0b1b33; }
</style>
</head>
<body class="bg-custom-dark min-h-screen p-4 md:p-10 font-sans">
<div class="max-w-6xl mx-auto">
<!-- Navegación superior -->
<div class="flex items-center text-white mb-8">
<button class="mr-4 p-2 hover:bg-white/10 rounded-full transition">
<svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M19 12H5M12 19l-7-7 7-7"/></svg>
</button>
<h1 class="text-2xl font-bold tracking-tight">Mis Reportes</h1>
</div>
<!-- Contenedor Principal (Tarjeta blanca) -->
<div class="bg-white rounded-3xl p-6 md:p-8 shadow-2xl">
<!-- Filtros -->
<div class="flex flex-col md:flex-row gap-4 mb-8">
<div class="flex-grow">
<label class="block text-sm font-semibold text-gray-700 mb-2">Buscar reporte</label>
<input type="text" placeholder="Buscar por tipo o ubicación..." class="w-full border border-gray-200 rounded-xl px-4 py-3 outline-none focus:ring-2 focus:ring-blue-100 transition">
</div>
<div class="flex gap-2 items-end">
<div class="flex-grow">
<label class="block text-sm font-semibold text-gray-700 mb-2">Filtrar por tipo</label>
<select class="w-full border border-gray-200 rounded-xl px-4 py-3 outline-none bg-white">
<option>Todos los tipos</option>
</select>
</div>
<button class="border border-gray-200 rounded-xl px-4 py-3 hover:bg-gray-50">
<svg class="w-6 h-6 text-gray-600" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path d="M3 4h18M6 10h12M9 16h6" stroke-width="2" stroke-linecap="round"/></svg>
</button>
</div>
</div>
<!-- Tabla / Lista -->
<div class="space-y-4">
<!-- Header de tabla (Visible solo en escritorio) -->
<div class="hidden md:grid grid-cols-4 px-4 text-sm font-semibold text-gray-400 mb-2">
<div>Tipo de incidente</div>
<div>Ubicación</div>
<div>Fecha y hora</div>
<div>Estado</div>
</div>
<!-- Fila 1 -->
<div class="grid grid-cols-1 md:grid-cols-4 items-center px-4 py-4 border border-gray-100 rounded-2xl hover:bg-gray-50 transition cursor-pointer">
<div class="font-bold text-gray-900 mb-2 md:mb-0">Robo</div>
<div class="text-gray-600 mb-2 md:mb-0">Calle Principal, San Salvador</div>
<div class="text-gray-600 mb-2 md:mb-0">7/30/2026, 2:45 PM</div>
<div class="flex justify-between md:justify-start items-center gap-4">
<span class="bg-orange-100 text-orange-700 px-4 py-1 rounded-full text-xs font-bold">En revisión</span>
<span class="text-gray-300">❯</span>
</div>
</div>
<!-- Fila 2 -->
<div class="grid grid-cols-1 md:grid-cols-4 items-center px-4 py-4 border border-gray-100 rounded-2xl hover:bg-gray-50 transition cursor-pointer">
<div class="font-bold text-gray-900 mb-2 md:mb-0">Acoso</div>
<div class="text-gray-600 mb-2 md:mb-0">Parque Cuscatlán</div>
<div class="text-gray-600 mb-2 md:mb-0">7/30/2026, 1:15 PM</div>
<div class="flex justify-between md:justify-start items-center gap-4">
<span class="bg-orange-100 text-orange-700 px-4 py-1 rounded-full text-xs font-bold">En revisión</span>
<span class="text-gray-300">❯</span>
</div>
</div>
<!-- Fila 3 -->
<div class="grid grid-cols-1 md:grid-cols-4 items-center px-4 py-4 border border-gray-100 rounded-2xl hover:bg-gray-50 transition cursor-pointer">
<div class="font-bold text-gray-900 mb-2 md:mb-0">Calle Oscura</div>
<div class="text-gray-600 mb-2 md:mb-0">Pasaje Los Pinos</div>
<div class="text-gray-600 mb-2 md:mb-0">7/29/2026, 11:30 PM</div>
<div class="flex justify-between md:justify-start items-center gap-4">
<span class="bg-green-100 text-green-700 px-4 py-1 rounded-full text-xs font-bold">Resuelto</span>
<span class="text-gray-300">❯</span>
</div>
</div>
</div>

</div>
</div>
</body>
</html>
