<!DOCTYPE html>
<html lang="es">

<head>
     <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet">

    <meta charset="UTF-8">

    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Mis Reportes - SafeWalk</title>

    <!-- Tailwind -->
    <script src="https://cdn.tailwindcss.com"></script>

    <style>

        .bg-custom-dark {
            background-color: #0b1b33;
        }

    </style>

</head>


<body class="bg-custom-dark min-h-screen p-4 md:p-10 font-sans">


    <div class="max-w-6xl mx-auto">


        <!-- ================================= -->
        <!-- ENCABEZADO -->
        <!-- ================================= -->

        <div class="flex items-center text-white mb-8">

            <button
                id="btnVolver"
                class="mr-4 p-2 hover:bg-white/10 rounded-full transition"
                onclick="volverPerfil()">

                <svg
                    width="24"
                    height="24"
                    viewBox="0 0 24 24"
                    fill="none"
                    stroke="currentColor"
                    stroke-width="2">

                    <path d="M19 12H5M12 19l-7-7 7-7"/>

                </svg>

            </button>


            <h1 class="text-2xl font-bold tracking-tight">
                Mis Reportes
            </h1>

        </div>



        <!-- ================================= -->
        <!-- CONTENEDOR -->
        <!-- ================================= -->

        <div class="bg-white rounded-3xl p-6 md:p-8 shadow-2xl">


            <!-- ================================= -->
            <!-- BUSCADOR Y FILTRO -->
            <!-- ================================= -->

            <div class="flex flex-col md:flex-row gap-4 mb-8">


                <!-- BUSCADOR -->

                <div class="flex-grow">

                    <label class="block text-sm font-semibold text-gray-700 mb-2">
                        Buscar reporte
                    </label>


                    <input
                        id="buscarReporte"
                        type="text"
                        placeholder="Buscar por tipo o ubicación..."
                        class="w-full border border-gray-200 rounded-xl px-4 py-3 outline-none focus:ring-2 focus:ring-blue-100 transition">

                </div>



                <!-- FILTRO -->

                <div class="flex gap-2 items-end">

                    <div class="flex-grow">

                        <label class="block text-sm font-semibold text-gray-700 mb-2">
                            Filtrar por tipo
                        </label>


                        <select
                            id="filtroTipo"
                            class="w-full border border-gray-200 rounded-xl px-4 py-3 outline-none bg-white">

                            <option value="todos">
                                Todos los tipos
                            </option>

                        </select>

                    </div>


                    <button
                        type="button"
                        class="border border-gray-200 rounded-xl px-4 py-3 hover:bg-gray-50">

                        <svg
                            class="w-6 h-6 text-gray-600"
                            fill="none"
                            stroke="currentColor"
                            viewBox="0 0 24 24">

                            <path
                                d="M3 4h18M6 10h12M9 16h6"
                                stroke-width="2"
                                stroke-linecap="round"/>

                        </svg>

                    </button>

                </div>

            </div>



            <!-- ================================= -->
            <!-- LISTA DE REPORTES -->
            <!-- ================================= -->

            <div class="space-y-4">


                <!-- ENCABEZADOS -->

                <div class="hidden md:grid grid-cols-4 px-4 text-sm font-semibold text-gray-400 mb-2">

                    <div>
                        Tipo de incidente
                    </div>

                    <div>
                        Ubicación
                    </div>

                    <div>
                        Fecha y hora
                    </div>

                    <div>
                        Estado
                    </div>

                </div>



                <!-- AQUÍ SE MOSTRARÁN LOS REPORTES -->

                <div
                    id="listaReportes"
                    class="space-y-4">

                </div>


            </div>


        </div>


    </div>



    <!-- ================================= -->
    <!-- JAVASCRIPT -->
    <!-- ================================= -->

  <script>

function volverPerfil() {
    window.location.href = "miperfil.html";
}


async function cargarReportes() {

    var lista = document.getElementById("listaReportes");

    // Limpiar lista
    lista.innerHTML = "";

    // Mensaje de carga
    var cargando = document.createElement("div");
    cargando.className = "text-center py-10 text-gray-400";
    cargando.textContent = "Cargando tus reportes...";

    lista.appendChild(cargando);


    try {

        var respuesta = await fetch("../reportes/reportes.php");

        var texto = await respuesta.text();

        console.log("RESPUESTA DEL PHP:");
        console.log(texto);


        var datos = JSON.parse(texto);


        // Si PHP devuelve error
        if (!datos.success) {

            lista.innerHTML = "";

            var errorMensaje = document.createElement("div");

            errorMensaje.className =
                "text-center py-10 text-red-400";

            errorMensaje.textContent =
                datos.message;

            lista.appendChild(errorMensaje);

            return;
        }


        // Obtener reportes
        var reportes = datos.reportes;


        // Si no hay reportes
        if (!reportes || reportes.length === 0) {

            lista.innerHTML = "";

            var sinReportes = document.createElement("div");

            sinReportes.className =
                "text-center py-10 text-gray-400";

            sinReportes.textContent =
                "No tienes reportes todavía.";

            lista.appendChild(sinReportes);

            return;
        }


        // Limpiar mensaje de carga
        lista.innerHTML = "";


        // Crear cada reporte
        reportes.forEach(function(reporte) {


            var fila = document.createElement("div");

            fila.className =
                "grid grid-cols-1 md:grid-cols-4 " +
                "items-center px-4 py-4 " +
                "border border-gray-100 rounded-2xl " +
                "hover:bg-gray-50 transition";


            // ==============================
            // TIPO
            // ==============================

            var tipo = document.createElement("div");

            tipo.className =
                "font-bold text-gray-900 mb-2 md:mb-0";

            tipo.textContent =
                reporte.nombre_tipo || "Sin tipo";


            // ==============================
            // UBICACIÓN
            // ==============================

            var ubicacion = document.createElement("div");

            ubicacion.className =
                "text-gray-600 mb-2 md:mb-0";

            ubicacion.textContent =
                (reporte.latitud || "") +
                ", " +
                (reporte.longitud || "");


            // ==============================
            // FECHA
            // ==============================

            var fecha = document.createElement("div");

            fecha.className =
                "text-gray-600 mb-2 md:mb-0";


            var fechaReporte =
                new Date(reporte.fecha_reporte);


            fecha.textContent =
                fechaReporte.toLocaleString("es-SV");


            // ==============================
            // ESTADO
            // ==============================

            var estadoContenedor =
                document.createElement("div");

            estadoContenedor.className =
                "flex items-center";


            var estado =
                document.createElement("span");


            estado.className =
                "px-4 py-1 rounded-full text-xs font-bold";


            switch (reporte.estado_reporte) {

                case "en_revision":

                    estado.textContent =
                        "En revisión";

                    estado.classList.add(
                        "bg-orange-100",
                        "text-orange-700"
                    );

                    break;


                case "resuelto":

                    estado.textContent =
                        "Resuelto";

                    estado.classList.add(
                        "bg-green-100",
                        "text-green-700"
                    );

                    break;


                case "vencido":

                    estado.textContent =
                        "Vencido";

                    estado.classList.add(
                        "bg-gray-100",
                        "text-gray-700"
                    );

                    break;


                case "eliminado":

                    estado.textContent =
                        "Eliminado";

                    estado.classList.add(
                        "bg-red-100",
                        "text-red-700"
                    );

                    break;


                default:

                    estado.textContent =
                        reporte.estado_reporte || "Sin estado";

                    estado.classList.add(
                        "bg-gray-100",
                        "text-gray-700"
                    );

                    break;
            }


            // Agregar estado al contenedor
            estadoContenedor.appendChild(estado);


            // ==============================
            // AGREGAR TODO A LA FILA
            // ==============================

            fila.appendChild(tipo);

            fila.appendChild(ubicacion);

            fila.appendChild(fecha);

            fila.appendChild(estadoContenedor);


            // Agregar fila a la lista
            lista.appendChild(fila);

        });


    } catch (error) {

        console.error(
            "Error cargando reportes:",
            error
        );


        lista.innerHTML = "";


        var errorCarga =
            document.createElement("div");


        errorCarga.className =
            "text-center py-10 text-red-400";


        errorCarga.textContent =
            "No se pudieron cargar tus reportes.";


        lista.appendChild(errorCarga);

    }

}


// Ejecutar al abrir
cargarReportes();

</script>


</body>

</html>
