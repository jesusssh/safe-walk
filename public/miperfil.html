<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title> Mi Perfil</title>

    <link rel="stylesheet" href="css/estilosper.css">
    
   
    <link rel="stylesheet"
        href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css">
</head>

<body>
    

    <main class="contenedor">

        <header class="header-pagina">
    <button class="btn-volver" onclick="window.location.href='mp.html'">
        <i class="fa-solid fa-arrow-left"></i>
    </button>
    <h1>Mi perfil</h1>
</header>

        
        <section class="perfil">

            <div class="foto-perfil">

                <img id="perfil" src="img/avatar.png" alt="Foto de Perfil">

                <label for="subirFoto" class="camara">
                    <i class="fa-solid fa-camera"></i>
                </label>

                <input
                    type="file"
                    id="subirFoto"
                    accept="image/*"
                    hidden>

            </div>

            <div class="datos-usuario">

                <h1 id="nombreUsuario">
                    Nombre Completo
                </h1>

                <p id="correoUsuario">
                    correo@ejemplo.com
                </p>

            </div>

        </section>


        <section class="estadisticas">

            <div class="card">

                <h2 id="cantidadReportes">0</h2>

                <p>Reportes</p>

            </div>

            <div class="card">

                <h2 id="cantidadContactos">0</h2>

                <p>Contactos</p>

            </div>

        </section>

      

        <section class="opciones">

            <button id="btnReportes" class="opcion">

                <div class="izquierda">

                    <i class="fa-solid fa-file-lines"></i>

                    <span>Mis Reportes</span>

                </div>

                <i class="fa-solid fa-chevron-right"></i>

            </button>

            <button id="btnEditar" class="opcion">

                <div class="izquierda">

                    <i class="fa-solid fa-user-pen"></i>

                    <span>Editar Perfil</span>

                </div>

                <i class="fa-solid fa-chevron-right"></i>

            </button>

           <button id="btnContactos" class="opcion" onclick="window.location.href='contac.html'">
    <div class="izquierda">
        <i class="fa-solid fa-address-book"></i>
        <span>Contactos de Emergencia</span>
    </div>
    <i class="fa-solid fa-chevron-right"></i>
</button>



            <button id="btnConfiguracion" class="opcion">

                <div class="izquierda">

                    <i class="fa-solid fa-gear"></i>

                    <span>Configuración</span>

                </div>

                <i class="fa-solid fa-chevron-right"></i>

            </button>

        </section>


        <section class="salir">

            <button id="btnCerrar" class="cerrar">

                <i class="fa-solid fa-right-from-bracket"></i>

                Cerrar Sesión

            </button>

            

    </main>

    <script src="js/contac.js"></script>
 <script src="js/configuracion.js"></script>
 <script src="js/scriptper.js"></script>
</body>

</html>
