<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Contactos de Emergencia - SafeWalk</title>

    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Montserrat:ital,wght@0,100..900;1,100..900&family=Roboto:ital,wght@0,100..900;1,100..900&display=swap" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="css/contac.css">
    <link rel="stylesheet" href="css/estilosper.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css">
</head>

<body>

    <main class="contenedor">

        <header class="header-pagina">
            <button id="btnVolver" class="btn-volver" onclick="volverPerfil()">
                <i class="fa-solid fa-arrow-left"></i>
            </button>
            <h1 id="lblTituloContactos" data-es="Contactos de Emergencia" data-en="Emergency Contacts">Contactos de Emergencia</h1>
        </header>

        <section class="lista-contactos">

            <div class="card-contacto">
                <div class="info-contacto">
                    <img src="img/avatar.png" alt="Foto Mamá" class="avatar-contacto">
                    <div class="datos">
                        <h3 id="lblContactoMama" data-es="Mamá" data-en="Mom">Mamá</h3>
                        <p>+52 55 1234 5678</p>
                    </div>
                </div>
                <a href="tel:+525512345678" class="btn-llamar">
                    <i class="fa-solid fa-phone"></i>
                </a>
            </div>

            <div class="card-contacto">
                <div class="info-contacto">
                    <img src="img/avatar.png" alt="Foto Papá" class="avatar-contacto">
                    <div class="datos">
                        <h3 id="lblContactoPapa" data-es="Papá" data-en="Dad">Papá</h3>
                        <p>+52 55 8765 4321</p>
                    </div>
                </div>
                <a href="tel:+525587654321" class="btn-llamar">
                    <i class="fa-solid fa-phone"></i>
                </a>
            </div>

            <div class="card-contacto">
                <div class="info-contacto">
                    <img src="img/avatar.png" alt="Foto Mejor Amiga" class="avatar-contacto">
                    <div class="datos">
                        <h3 id="lblContactoAmiga" data-es="Mejor Amiga" data-en="Best Friend">Mejor Amiga</h3>
                        <p>+52 55 1122 3444</p>
                    </div>
                </div>
                <a href="tel:+525511223444" class="btn-llamar">
                    <i class="fa-solid fa-phone"></i>
                </a>
            </div>

        </section>

        <section class="acciones-contacto">
            <button class="btn-agregar" onclick="agregarContacto()">
                <i class="fa-solid fa-user-plus"></i>
                <span id="lblBtnAgregar" data-es="Agregar Nuevo Contacto" data-en="Add New Contact">Agregar Nuevo Contacto</span>
            </button>
        </section>

    </main>

    <script src="js/contac.js"></script>

</body>

</html>
