<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SafeWalk - Nuevo Reporte</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Montserrat:ital,wght@0,100..900;1,100..900&family=Roboto:ital,wght@0,100..900;1,100..900&display=swap" rel="stylesheet">

    <link href="https://cdn.jsdelivr.net/npm.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="css/reportes.css">
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css">
</head>
<body>

    <div class="reporte-container">

        <div class="header-reporte">
            <a href="mp.html" class="volver">&#8592;</a>
            <h2>Nuevo Reporte</h2>
        </div>

        <div class="reporte-card">

            <h3>Tipo de incidente</h3>

            <div class="tipos">

                <button type="button" class="tipo-btn">
                    <img src="img/mala-persona.png" class="tipo-icono">
                    <span>Robo</span>
                </button>

                <button type="button" class="tipo-btn">
                    <img src="img/excluir.png" class="tipo-icono">
                    <span>Acoso</span>
                </button>

                <button type="button" class="tipo-btn">
                    <img src="img/mala-idea.png" class="tipo-icono">
                    <span>Calle oscura</span>
                </button>

                <button type="button" class="tipo-btn">
                    <img src="img/otro.png" class="tipo-icono">
                    <span>Otro</span>
                </button>

            </div>

            <h3 class="mt-4">Ubicación del incidente</h3>
            <p class="texto-mapa">Selecciona el lugar donde ocurrió el incidente.</p>

<div id="mapaIncidente">
    <input type="hidden" id="latitud">
    <input type="hidden" id="longitud">
</div>
            <h3 class="mt-4">Descripción (Opcional)</h3>

            <textarea
                class="form-control"
                id="descripcion"
                rows="4"
                maxlength="200"
                placeholder="Cuenta lo que sucedió..."></textarea>

            <div class="contador">
                <span id="contador">0</span>/200
            </div>

            <h3 class="mt-4">Agregar foto</h3>

            <input
                type="file"
                class="form-control">

            <button class="btn-enviar">
                Enviar Reporte
            </button>

        </div>
    </div>
    </div>
<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script><script src="js/reportes.js"></script>
</body>
</html>
