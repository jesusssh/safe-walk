<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Notificaciones - SafeWalk</title>

<script src="https://cdn.tailwindcss.com"></script>

<style>
.bg-custom-dark{
    background-color:#0b1b33;
}
</style>

</head>

<body class="bg-custom-dark min-h-screen p-4 md:p-10 font-sans">

<div class="max-w-4xl mx-auto">

    <div class="flex items-center justify-between text-white mb-8">

        <div class="flex items-center">

            <button
            onclick="history.back()"
            class="mr-4 p-2 hover:bg-white/10 rounded-full transition">

                ←

            </button>

            <h1 class="text-2xl font-bold">
                Notificaciones
            </h1>

        </div>

        <button
        id="btnLimpiar"
        class="border border-white/20 px-4 py-1.5 rounded-full text-sm hover:bg-white/10 transition">

            Limpiar historial

        </button>

    </div>

    <div class="bg-white rounded-3xl p-6 md:p-8 shadow-2xl">

        <h2 class="text-lg font-bold text-gray-900 mb-4">
            Recientes
        </h2>

        <div
        id="listaNotificaciones"
        class="space-y-3">

        </div>

        <div class="mt-8 pt-6 border-t border-gray-100 text-center">

            <p
            class="text-xs text-gray-500">

                ⓘ Las notificaciones se almacenan localmente en este dispositivo.

            </p>

        </div>

    </div>

</div>

<script>

const contenedor =

document.getElementById(
    "listaNotificaciones"
);

const historial =

JSON.parse(

    localStorage.getItem(
        "notificacionesSafeWalk"
    )

) || [];

if(
    historial.length === 0
){

    contenedor.innerHTML =

    `
    <div
    class="
    border
    border-gray-100
    rounded-2xl
    p-4
    text-gray-500
    ">

        No hay notificaciones registradas.

    </div>
    `;

}
else{

    historial.forEach(
        alerta => {

            contenedor.innerHTML +=

            `
            <div
            class="
            border
            border-gray-100
            rounded-2xl
            p-4
            flex
            justify-between
            items-center
            hover:bg-gray-50
            transition
            ">

                <div>

                    <p
                    class="
                    font-bold
                    text-gray-900
                    ">

                        ⚠️ ${alerta.tipo}

                    </p>

                    <p
                    class="
                    text-sm
                    text-gray-500
                    ">

                        Distancia:
                        ${alerta.distancia}
                        metros

                    </p>

                </div>

                <div>

                    <span
                    class="
                    text-sm
                    text-gray-400
                    ">

                        ${alerta.fecha}

                    </span>

                </div>

            </div>
            `;

        }
    );

}

document
.getElementById("btnLimpiar")
.addEventListener(
    "click",
    function(){

        localStorage.removeItem(
            "notificacionesSafeWalk"
        );

        location.reload();

    }
);

</script>

</body>
</html>
