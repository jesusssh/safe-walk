<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <link rel="stylesheet" href="css/rutas_seguras.css">
    <script src="js/rutas_seguras.js"></script>
</head>
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css">
    <link rel="stylesheet" href="https://unpkg.com/leaflet-routing-machine@latest/dist/leaflet-routing-machine.css" />
<body>
    <div class="rutas-container">

    <div class="header-rutas">

        <a href="mp.html" class="volver"></ahref>
             ←
        
    
        </a>

        <h2 id="lblTituloRutas">Rutas Seguras</h2>

    </div>

    <div class="rutas-card">
<h5 id="lblUbicacionActual">Current Location</h5>
<button
    id="btnUbicacion"
    class="btn-ubicacion"
    disabled>

     Current Location Ready

</button>

<input
    type="hidden"
    id="ubicacionActual">

        <h5 class="mt-4" id="lblDestino">Destino</h5>

        <p class="texto-ayuda" id="txtAyudaDestino">
            Selecciona tu destino directamente en el mapa.
        </p>

        <div id="mapaRutas"></div>
        <div class="info-ruta">

    <div class="estadisticas-ruta">

        <div class="card-ruta">

            <div>📏</div>

            <h3 id="distancia">--</h3>

            <span>Distance</span>

        </div>

        <div class="card-ruta">

            <div>⏱️</div>

            <h3 id="tiempo">--</h3>

            <span>Duration</span>

        </div>
        <div class="seguridad-card" id="seguridadCard">

    <span class="titulo-info">
        Safety Level
    </span>

    <h3 id="seguridad">
        --
    </h3>

</div>

<div class="reportes-card">

    <span class="titulo-info">
        Nearby Reports
    </span>

    <h3 id="reportesEncontrados">
        0
    </h3>

</div>

<div class="riesgos-card">

    <span class="titulo-info">
        Detected Risks
    </span>

    <ul id="listaRiesgos"></ul>

</div>

    </div>

        <button class="btn-ruta">
            <span id="lblBuscarRuta">
            Buscar Ruta Segura
            </span>
        </button>

    </div>

</div>
<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
<script src="https://unpkg.com/leaflet-routing-machine@latest/dist/leaflet-routing-machine.js"></script>
</body>
</html>
