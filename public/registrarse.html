<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SafeWalk - Registro</title>

    <link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Montserrat:ital,wght@0,100..900;1,100..900&family=Roboto:ital,wght@0,100..900;1,100..900&display=swap" rel="stylesheet">

   <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="css/registro.css">
</head>
<body>

<body>

<div class="registro-container">

    <div class="logo-section">
        <img src="img/logo__1_-removebg-preview.png" alt="SafeWalk" class="logo-img">

        <p class="slogan">
            Camina seguro. Llega seguro
        </p>
    </div>

    <div class="registro-card">

        <h2>Crear Cuenta</h2>

        <form id="formRegistro">

            <div class="mb-3">
                <label class="form-label">Nombre</label>
               <input type="text" class="form-control" id="nombre">
            </div>
            <div class="mb-3">
               <label class="form-label">Apellido</label>
                <input type="text" class="form-control" id="apellido">
            </div>
            
            <div class="mb-3">
                <label class="form-label">Usuario</label>
                <input type="text" class="form-control" id="usuario">
            </div>

            <div class="mb-3">
                <label class="form-label">Correo Electrónico</label>
                <input id="correo"  type="email" class="form-control">
            </div>

            <div class="mb-3">
                <label class="form-label">Contraseña</label>
                <input id="password" type="password" class="form-control">
            </div>

            <div class="mb-3">
                <label class="form-label">Confirmar Contraseña</label>
                <input id="confirmar"type="password" class="form-control">
            </div>

            <div class="form-check mb-3">
                <input id="terminos" class="form-check-input" type="checkbox">
                <label  class="form-check-label">
                    Acepto los Términos y Condiciones
                </label>
            </div>

            <button type="submit" class="registro-btn" link href="mp.html">
                Registrarse
            </button>

        </form>

        <div class="text-login">
            ¿Ya tienes cuenta?
            <a href="inicio2.html" class="login-link">
                Inicia sesión
            </a>
        </div>

    </div>

</div>
<script src="js/registro.js"></script>
<script src="js/registro1.js"></script>
</body>
</html>
