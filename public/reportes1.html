<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <title>Nuevo Reporte - SafeWalk</title>
    <style>
        body { font-family: sans-serif; display: flex; justify-content: center; align-items: center; min-height: 100vh; background: #e0e0e0; margin: 0; }
        
        .phone-container {
            width: 320px;
            height: 650px;
            background: white;
            border-radius: 40px;
            border: 8px solid #333;
            display: flex;
            flex-direction: column;
            overflow: hidden;
            position: relative;
        }

        .header { background: #1a0f42; color: white; padding: 20px; display: flex; align-items: center; font-size: 18px; font-weight: bold; }
        .back-btn { margin-right: 15px; cursor: pointer; }

        .content { padding: 20px; flex-grow: 1; overflow-y: auto; }

        h3 { font-size: 16px; margin: 0 0 15px 0; }

        .grid { display: grid; grid-template-columns: 1fr 1fr; gap: 15px; margin-bottom: 25px; }
        
        .card { 
            padding: 15px; 
            border-radius: 20px; 
            text-align: center; 
            font-weight: bold; 
            cursor: pointer;
            font-size: 13px;
        }
        
        .card-icon { font-size: 30px; margin-bottom: 5px; display: block; }
        
        /* Colores */
        .card-robo { background: #ffcdd2; }
        .card-acoso { background: #fff9c4; }
        .card-oscura { background: #fff9c4; }
        .card-otro { background: #b3e5fc; }

        label { font-weight: bold; font-size: 12px; display: block; margin-top: 15px; margin-bottom: 5px; color: #333; }
        
        input, textarea { 
            width: 100%; 
            padding: 10px; 
            border: 1px solid #ccc; 
            border-radius: 5px; 
            box-sizing: border-box; 
        }

        .photo-area { 
            border: 2px dashed #1a0f42; 
            padding: 15px; 
            text-align: center; 
            color: #1a0f42; 
            margin-top: 10px; 
            cursor: pointer; 
            font-size: 12px; 
        }

        .submit-btn { 
            width: 100%; 
            background: #2b57d6; 
            color: white; 
            padding: 15px; 
            border: none; 
            border-radius: 5px; 
            margin-top: 20px; 
            cursor: pointer; 
            font-weight: bold; 
        }

        .navbar { 
            display: flex; 
            justify-content: space-around; 
            padding: 15px; 
            border-top: 1px solid #ddd; 
            background: white; 
            font-size: 10px; 
            color: #555; 
        }
    </style>
</head>
<body>

    <div class="phone-container">
        <div class="header">
            <div class="back-btn">←</div> Nuevo reporte
        </div>
        
        <div class="content">
            <h3>Tipo de incidente</h3>
            <div class="grid">
                <div class="card card-robo"><span class="card-icon">🏃</span>Robo</div>
                <div class="card card-acoso"><span class="card-icon">✋</span>Acoso</div>
                <div class="card card-oscura"><span class="card-icon">💡</span>Calle Oscura</div>
                <div class="card card-otro"><span class="card-icon">🔵</span>Otro...</div>
            </div>
            
            <label>Ubicación</label>
            <input type="text" value="Calle 45 con Av. 10">
            
            <label>Descripción (opcional)</label>
            <textarea rows="3" placeholder="Cuenta lo que sucedió.."></textarea>
            
            <label>Agregar foto (opcional)</label>
            <div class="photo-area">📸<br>Tomar foto</div>
            
            <button class="submit-btn">Enviar Reporte</button>
        </div>

        <div class="navbar">
            <div>🏠<br>Inicio</div>
            <div>⚠️<br>Alertas</div>
            <div>➕<br>Reportar</div>
            <div>🚨<br>SOS</div>
            <div>🛡️<br>Rutas</div>
            <div>👤<br>Perfil</div>
        </div>
    </div>

</body>
</html>
