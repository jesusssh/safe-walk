<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Nuevo Reporte - Sentinel</title>
<!-- Bootstrap CSS -->
<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
<!-- FontAwesome (para el ícono de la flecha y la cámara) -->
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
<style>
       /* Fondo similar al que se asoma en los bordes de tu pantalla de perfil */
       body {
           background-color: #2b3035; /* Un gris oscuro/azulado */
           display: flex;
           justify-content: center;
           align-items: center;
           min-height: 100vh;
           margin: 0;
           font-family: Arial, sans-serif;
       }
       /* Contenedor principal estilo tarjeta (como en image_2.png) */
       .card-web {
           background-color: #ffffff;
           width: 100%;
           max-width: 800px;
           border-radius: 12px;
           box-shadow: 0 4px 15px rgba(0,0,0,0.1);
           overflow: hidden;
           margin: 20px;
       }
       /* Encabezado negro con título centrado y flecha */
       .card-header-black {
           background-color: #1a1a1a;
           color: #ffffff;
           display: flex;
           align-items: center;
           padding: 15px 20px;
       }
       .card-header-black i {
           font-size: 1.2rem;
           cursor: pointer;
       }
       .card-header-black h5 {
           margin: 0;
           flex-grow: 1;
           text-align: center;
           font-weight: bold;
           font-size: 1.1rem;
       }
       /* Cuerpo del formulario */
       .card-body-custom {
           padding: 40px;
       }
       /* Botones de tipo de incidente */
       .btn-incidente {
           border: none;
           border-radius: 15px;
           padding: 25px 10px;
           width: 100%;
           display: flex;
           flex-direction: column;
           align-items: center;
           font-weight: 600;
           transition: transform 0.2s ease;
       }
       .btn-incidente:hover {
           transform: scale(1.03);
           opacity: 0.9;
       }
       .btn-incidente .emoji {
           font-size: 2.5rem;
           margin-bottom: 8px;
       }
       /* Colores específicos de los botones */
       .btn-robo { background-color: #ffcdd2; color: #b71c1c; }
       .btn-acoso { background-color: #ffe0b2; color: #e65100; }
       .btn-calle { background-color: #fff9c4; color: #f57f17; }
       .btn-otro { background-color: #b3e5fc; color: #01579b; }
       /* Estilos de inputs */
       .form-label {
           font-weight: 600;
           font-size: 0.95rem;
           color: #333;
           margin-top: 15px;
       }
       .form-control {
           background-color: #f8f9fa;
           border: 1px solid #dee2e6;
           border-radius: 8px;
           padding: 12px;
       }
       /* Caja punteada para la foto */
       .box-foto {
           border: 2px dashed #adb5bd;
           border-radius: 10px;
           padding: 30px;
           text-align: center;
           color: #6c757d;
           cursor: pointer;
           background-color: #f8f9fa;
           transition: background-color 0.2s;
       }
       .box-foto:hover {
           background-color: #e9ecef;
       }
</style>
</head>
<body>
<div class="card-web">
<!-- Header -->
<div class="card-header-black">
<i class="fa-solid fa-arrow-left"></i>
<h5>Nuevo reporte</h5>
<div style="width: 20px;"></div> <!-- Espaciador invisible para centrar el texto -->
</div>
<!-- Body -->
<div class="card-body-custom">
<h6 class="fw-bold mb-4">Tipo de incidente</h6>
<!-- Grid de Bootstrap: 2 columnas en móvil (col-6), 4 columnas en PC (col-md-3) -->
<div class="row g-3 mb-4">
<div class="col-6 col-md-3">
<button class="btn-incidente btn-robo">
<span class="emoji">🏃‍♀️</span>
                       Robo
</button>
</div>
<div class="col-6 col-md-3">
<button class="btn-incidente btn-acoso">
<span class="emoji">🤚🏻</span>
                       Acoso
</button>
</div>
<div class="col-6 col-md-3">
<button class="btn-incidente btn-calle">
<span class="emoji">💡</span>
                       Calle Oscura
</button>
</div>
<div class="col-6 col-md-3">
<button class="btn-incidente btn-otro">
<span class="emoji">🔵</span>
                       Otro...
</button>
</div>
</div>
<!-- Campos de texto -->
<div class="mb-3">
<h5 class="mt-4">Ubicación del incidente</h5>

            <div class="opciones-ubicacion">

            <label>
            <input
            type="radio"
            name="ubicacionTipo"
            checked
            onclick="mostrarUbicacionActual()">

        Mi ubicación actual
    </label>

    <label>
        <input
            type="radio"
            name="ubicacionTipo"
            onclick="mostrarMapa()">

        Seleccionar en mapa
    </label>

</div>

<div id="ubicacionActual">

    <input
        type="text"
        id="ubicacion"
        class="form-control"
        placeholder="Ubicación actual">

    <button
        type="button"
        class="btn-ubicacion"
        onclick="obtenerUbicacion()">

        📍 Obtener mi ubicación
    </button>

</div>
<!-- Botón de envío (Agregado para completar el formato web) -->
<div class="d-grid mt-4">
<button class="btn btn-dark py-2" style="border-radius: 8px;">Enviar Reporte</button>
</div>
</div>
</div>

    <link rel="stylesheet" href="https://unpkg.com/leaflet/dist/leaflet.js2reportes.jsscript">
    <script src="js/reportes.js"></script>
</body>
</html>
