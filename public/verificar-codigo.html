<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <link rel="stylesheet" href="css/verificar-codigo.css">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.7/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body>
<div class="verificar-container">

    <div class="logo-section">

        <img src="img/logo__1_-removebg-preview.png" alt="SafeWalk" class="logo-img">
        <p class="slogan">
            Camina seguro. Llega seguro
        </p>

    </div>

    <div class="verificar-card">

        <h2>Verificar Código</h2>

        <p class="mensaje">
            Hemos enviado un código de 6 dígitos a tu correo electrónico.
        </p>

        <div class="codigo-container">

            <input type="text" maxlength="1" class="codigo-input">
            <input type="text" maxlength="1" class="codigo-input">
            <input type="text" maxlength="1" class="codigo-input">
            <input type="text" maxlength="1" class="codigo-input">
            <input type="text" maxlength="1" class="codigo-input">
            <input type="text" maxlength="1" class="codigo-input">

        </div>

        <button class="btn-verificar">
            Verificar Código
        </button>

        <div class="reenviar">
            ¿No recibiste el código?
        </div>

    </div>

</div>
<script src="js/verificar-codigo.js"></script>
</body>
</html>
