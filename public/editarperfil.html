<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Editar Perfil</title>

    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Montserrat:ital,wght@0,100..900;1,100..900&family=Roboto:ital,wght@0,100..900;1,100..900&display=swap" rel="stylesheet">

    <link rel="stylesheet" href="css/editarperfil.css">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css">
</head>

<body>

<div class="contenedor">

    <header class="header-pagina">
        <button id="btnVolver" class="btn-volver" onclick="volverPerfil()">
            <i class="fa-solid fa-arrow-left"></i>
        </button>
        <h1 id="lblTituloEditar" data-es="Editar Perfil" data-en="Edit Profile">Editar Perfil</h1>
    </header>

    <div class="card">

        <div class="foto">
            <img id="fotoPerfil" src="img/avatar.png" alt="Perfil">
            <label for="nuevaFoto" class="camara">
                <i class="fa-solid fa-camera"></i>
            </label>
            <input type="file" id="nuevaFoto" accept="image/*" hidden>
        </div>

        <form>
            <div class="grupo">
                <label id="lblNombreLabel" for="nombre" data-es="Nombre completo" data-en="Full Name">Nombre completo</label>
                <input type="text" id="nombre" placeholder="Ingrese su nombre">
            </div>

            <div class="grupo">
                <label id="lblApellido" for="apellido" data-es="Apellido" data-en="Last Name">Apellido</label>
                <input type="text" id="apellido" placeholder="Ingrese su apellido">
            </div>

            <div class="grupo">
                <label id="lblCorreoLabel" for="correo" data-es="Correo electrónico" data-en="Email Address">Correo electrónico</label>
                <input type="email" id="correo" placeholder="correo@ejemplo.com">
            </div>

            <div class="grupo">
                <label id="lblTelefono" for="telefono" data-es="Teléfono" data-en="Phone Number">Teléfono</label>
                <input type="tel" id="telefono" placeholder="0000-0000">
            </div>

            <div class="grupo">
                <label id="lblNuevaContraseña" for="password" data-es="Nueva Contraseña" data-en="New Password">Nueva Contraseña</label>
                <input type="password" id="password" placeholder="********">
            </div>

            <div class="botones">
                <button type="button" id="guardar" data-es="Guardar Cambios" data-en="Save Changes">
                    Guardar Cambios
                </button>

                <button type="button" class="btn-cancelar" onclick="window.location.href='miperfil.html'" id="cancelar" data-es="Cancelar" data-en="Cancel">
                    Cancelar
                </button>
            </div>
        </form>

    </div>

</div>

<script src="js/editarperfil.js"></script>

</body>

</html>
