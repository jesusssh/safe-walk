<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Interfaz SafeWalk</title>
    <style>
        /* Estilos generales */
        body {
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            margin: 0;
            background-color: #f0f0f0;
            font-family: Arial, sans-serif;
        }

        /* Contenedor tipo "teléfono" */
        .app-container {
            width: 320px;
            height: 600px;
            background-color: #1a0f42; /* Azul oscuro */
            border-radius: 40px;
            padding: 30px;
            color: white;
            display: flex;
            flex-direction: column;
            align-items: center;
            box-shadow: 0 10px 30px rgba(0,0,0,0.3);
            text-align: center;
        }

        h1 { margin-bottom: 5px; }
        p { margin-bottom: 30px; opacity: 0.9; }

        /* Estilo de los cuadros de texto */
        .input-box {
            width: 100%;
            height: 60px;
            background: transparent;
            border: 2px solid white;
            border-radius: 5px;
            margin-bottom: 20px;
            color: white;
            padding: 10px;
            box-sizing: border-box;
            resize: none;
        }

        /* Botón Enviar */
        .submit-btn {
            width: 100%;
            padding: 15px;
            background-color: #2b57d6; /* Azul brillante */
            color: white;
            border: none;
            border-radius: 8px;
            font-size: 18px;
            cursor: pointer;
            margin-top: 10px;
        }

        .submit-btn:hover {
            background-color: #1e45b3;
        }
    </style>
</head>
<body>

    <div class="app-container">
        <h1>SafeWalk</h1>
        <p>Camina seguro. Llega seguro</p>

        <!-- Formulario -->
        <textarea class="input-box" placeholder="¿Te sentiste más seguro/a al usar Safe Walk?"></textarea>
        <textarea class="input-box" placeholder="¿Te fue de utilidad Safe Walk?"></textarea>
        <textarea class="input-box" placeholder="¿Lo seguirías utilizando en tu día a día?"></textarea>
        <textarea class="input-box" placeholder="¿Hubo alguna función que NO te sirvió para nada?"></textarea>

        <button class="submit-btn">Enviar</button>
    </div>

</body>
</html>
